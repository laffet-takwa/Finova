server:
  port: ${SERVER_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: discovery-server
  main:
    web-application-type: servlet
  cloud:
    service-registry:
      eureka:
        client:
          # A registry never registers with, or fetches from, itself.
          register-with-eureka: false
          fetch-registry: false
          service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
        instance:
          prefer-ip-address: true
    netflix:
      eureka:
        server:
          # The dashboard and the peer replication endpoints are open; the
          # registry holds no business data and no credentials.
          enable-self-preservation: true
          eviction-interval-timer-in-ms: 60000
          response-cache-update-interval-ms: 5000
          use-read-only-response-cache: true
      instance:
        lease-renewal-interval-in-seconds: 10
        lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    eureka:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Finova Eureka service registry
    version: 1.0.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

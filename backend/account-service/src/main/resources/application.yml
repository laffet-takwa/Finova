server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finova_accounts}
    username: ${DB_USER:finova}
    password: ${DB_PASSWORD:finova}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: finova-account-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.finova.common.event.*,com.finova.account.domain.*"
        spring.json.value.default.type: com.finova.common.event.DomainEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record
      missing-topics-fatal: false
  cloud:
    service-registry:
      eureka:
        client:
          service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
          instance:
            prefer-ip-address: true
        instance:
          health-check-enabled: true
          prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    description: Account ownership, balances and status lifecycle for the Finova platform
    version: 1.0.0
finova:
  jwt:
    secret: ${JWT_SECRET:finova-local-development-secret-key-change-me-32bytes}
    issuer: ${JWT_ISSUER:finova}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:3600}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}
  clients:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  operations-sorter: method
  tags-sorter: alpha
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

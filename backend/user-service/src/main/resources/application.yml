server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finova_users}
    username: ${DB_USER:finova}
    password: ${DB_PASSWORD:finova}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: finova-user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.finova.common.event.*,com.finova.*"
        spring.json.value.default.type: com.finova.common.event.DomainEvent
        # The payload generic is resolved by the consumer itself with an explicit
        # TypeReference, so the type headers are ignored: one trusted default type
        # for every record and no surprise mapping.
        spring.json.use.type.headers: false
        spring.json.value.default.type.nullable: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record
      missing-topics-fatal: false
  cloud:
    service-registry:
      eureka:
        client:
          service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
          instance:
            prefer-ip-address: true
        instance:
          health-check-enabled: true
          prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Finova User Service - identity, JWT issuance, customer profile and the platform audit trail
    version: 1.0.0

finova:
  jwt:
    secret: ${JWT_SECRET:finova-local-development-secret-key-change-me-32bytes}
    issuer: ${JWT_ISSUER:finova}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:3600}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}
  users:
    # How many recent sign-ins the security panel lists.
    recent-login-limit: ${RECENT_LOGIN_LIMIT:5}
    # Retention of the append-only audit trail, in days. Rows older than this are
    # purged nightly; the trail is a security record, not an analytics store.
    audit-retention-days: ${AUDIT_RETENTION_DAYS:365}
    audit-purge-cron: "0 0 4 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

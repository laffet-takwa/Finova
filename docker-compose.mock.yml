# ======================================================================
# FINOVA — Docker Compose override: frontend-only, mock mode
#
# Runs the SPA in isolation against the built-in mock API, so the whole
# product is explorable without a backend, a database or a broker.
#
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up frontend
#
# Only the frontend service and its network are started; everything else in
# the base file is ignored when you name services explicitly.
# ======================================================================
services:
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        # Mock mode is baked into the bundle at build time, so the container
        # needs no backend at all.
        VITE_USE_MOCKS: "true"
    container_name: finova-frontend-mock
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
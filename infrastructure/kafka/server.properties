# ======================================================================
# FINOVA — Kafka (KRaft mode, no ZooKeeper)
#
# KRaft is the ZooKeeper replacement: a single combined controller+broker
# process for a local environment. Scaling out means splitting CONTROLLER
# quorum from BROKER nodes, which is a deployment concern, not a config one.
# ======================================================================

KAFKA_NODE_ID=1
KAFKA_PROCESS_ROLES=broker,controller
KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

# --- Storage ---
KAFKA_LOG_DIRS=/var/lib/kafka/data
KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0

# --- Topic defaults ---
# auto.create.topics.enable=false on purpose: an accidental typo in a topic
# name must fail loudly rather than silently create an empty partition that
# no consumer ever reads.
KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
KAFKA_NUM_PARTITIONS=3
KAFKA_DEFAULT_REPLICATION_FACTOR=1
KAFKA_MESSAGE_MAX_BYTES=10485760
KAFKA_REPLICA_FETCH_MAX_BYTES=10485760

# --- Retention ---
# Transaction and audit topics are long-lived business records; the topic
# bootstrap overrides these per topic.
KAFKA_LOG_RETENTION_HOURS=168
KAFKA_LOG_SEGMENT_BYTES=1073741824

CLUSTER_ID=${CLUSTER_ID:-finova-local-cluster-01}
KAFKA_HEAP_OPTS="-Xms512m -Xmx1g"
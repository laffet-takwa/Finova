# ======================================================================
# FINOVA — Logstash pipeline
#
# Services write structured, single-line logs to stdout. Docker's json-file
# driver tags each line with the emitting container, so the pipeline can
# attribute every event to a service and environment without the application
# having to know anything about the log pipeline.
# ======================================================================

input {
  tcp {
    port  => 5000
    codec => json_lines {
      ecs_compatibility => v8
    }
  }
}

filter {
  # --- Enrich with container metadata so every document is attributable ---
  if [container][name] {
    mutate {
      add_field => { "service" => "%{[container][name]}" }
    }
  }

  # Application logback patterns look like:
  #   2026-10-01 12:00:00.000  INFO [user-service,3f1c9a2b] message
  # Split that back into structured fields.
  if [message] {
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:logTimestamp}\s+%{LOGLEVEL:level}\s+\[%{DATA:logger},\s*%{DATA:correlationId}\]\s+%{GREEDYDATA:logMessage}",
          "%{TIMESTAMP_ISO8601:logTimestamp}\s+%{LOGLEVEL:level}\s+%{GREEDYDATA:logMessage}"
        ]
      }
      tag_on_failure => [ "_logstash_grok_skip" ]
    }

    if [logMessage] {
      mutate { replace => { "message" => "%{logMessage}" } }
    }
    if [logTimestamp] {
      date {
        match  => [ "logTimestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }
  }

  # --- Gateway access log lines ---
  #   http_request method=GET path=/api/accounts status=200 durationMs=42 userId=...
  if [message] =~ /^http_request / {
    mutate { add_tag => [ "finova_access_log" ] }
    grok {
      match => {
        "message" => [
          "http_request method=%{WORD:httpMethod}\s+path=%{URIPATH:requestPath}\(?%{DATA:requestQuery}\)?\s+status=%{NUMBER:httpStatus:int}\s+durationMs=%{NUMBER:durationMs:int}\s*%{GREEDYDATA:rest}"
        ]
      }
      tag_on_failure => [ "_logstash_access_skip" ]
    }
  }

  if [level] {
    mutate { lowercase => { "level" => "%{[level]}" } }
  }

  # --- Domain events are logged as structured JSON by the services ---
  if [message] =~ /"eventId"/ {
    json {
      source      => "message"
      target      => "event"
      skip_on_invalid_json => true
    }
    mutate { add_tag => [ "finova_domain_event" ] }
  }

  # --- Normalise log level to the ECS vocabulary the dashboards expect ---
  if [level] {
    if [level] in ["trace"]  { mutate { replace => { "log.level" => "trace" } } }
    if [level] in ["debug"]  { mutate { replace => { "log.level" => "debug" } } }
    if [level] in ["info"]   { mutate { replace => { "log.level" => "info"  } } }
    if [level] in ["warn"]   { mutate { replace => { "log.level" => "warn"  } } }
    if [level] in ["error"]  { mutate { replace => { "log.level" => "error" } } }
    if [level] in ["fatal"]  { mutate { replace => { "log.level" => "fatal" } } }
  }

  # --- Correlation id arrives under several names; converge on one ---
  if ![correlationId] and [MDC_corr] { mutate { add_field => { "correlationId" => "%{[MDC_corr]}" } } }
  if ![correlationId] and [thread]   { mutate { remove_field => ["thread"] } }

  # --- Drop container/system noise that is not Finova's ---
  if [service] == "kibana" or [service] == "logstash" or [service] == "elasticsearch" {
    mutate { add_tag => [ "_infra_drop" ] }
  }

  date {
    match  => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    tag_on_failure => []
  }

  mutate {
    remove_field => [ "agent", "ecs", "host", "input", "logstash_version" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "finova-logs-%{+YYYY.MM.dd}"
    user => "${ELASTICSEARCH_USERNAME:}"
    password => "${ELASTICSEARCH_PASSWORD:}"
  }

  stdout { codec => rubydebug }
}
# ======================================================================
# FINOVA — ELK stack
#
#   elasticsearch  storage + full-text + aggregation
#   logstash       parses the structured log stream, enriches it with
#                  container metadata, ships to Elasticsearch
#   kibana         dashboards for Requests / Errors / Transaction Events /
#                  Fraud Events / Service Health
#
# Single-node with security disabled: this is a local development stack.
# For anything beyond that, enable the built-in user/role security and put
# TLS on the transport layer.
# ======================================================================
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.13.4}
    container_name: finova-elasticsearch
    environment:
      - node.name=finova-elasticsearch
      - cluster.name=finova-logs
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks: [finova]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-8.13.4}
    container_name: finova-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx768m
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash-data:/usr/share/logstash/data
    ports:
      - "${LOGSTASH_PORT:-5000}:5000/tcp"
    networks: [finova]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines | grep -q main || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.13.4}
    container_name: finova-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
      - SERVER_NAME=finova-kibana
      - SERVER_HOST=0.0.0.0
      - TELEMETRY_ENABLED=false
      - I18N_LOCALE=en
      - I18N_TIMEZONE=UTC
    volumes:
      - kibana-data:/usr/share/kibana/data
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks: [finova]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  elasticsearch-data:
  logstash-data:
  kibana-data:

networks:
  finova:
    driver: bridge
# ======================================================================
# FINOVA — namespace
#
# ResourceQuota and LimitRange make the cost and blast radius of a
# runaway pod explicit before it happens, rather than after.
# ======================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: finova
  labels:
    app.kubernetes.io/part-of: finova
    app.kubernetes.io/version: "1.0.0"
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: finova-quota
  namespace: finova
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "4"
    pods: "40"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: finova-limits
  namespace: finova
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: finova-gateway-pdb
  namespace: finova
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
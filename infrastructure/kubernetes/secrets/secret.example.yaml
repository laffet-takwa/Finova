# ======================================================================
# FINOVA — secrets (EXAMPLE)
#
# This file is a TEMPLATE. It is committed with placeholder values and is
# deliberately named `.example` so it never gets applied by accident.
#
# Real usage:
#   kubectl create secret generic finova-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DB_PASSWORD="…" \
#     --from-literal=MONGODB_PASSWORD="…" -n finova
#
# Or, with External Secrets Operator + a managed vault:
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata: { name: finova-secrets, namespace: finova }
#   spec:
#     secretStoreRef: { name: vault, kind: ClusterSecretStore }
#     target: { name: finova-secrets }
#     data:
#       - { secretKey: JWT_SECRET,   remoteRef: { key: finova, property: jwt_secret } }
#       - { secretKey: DB_PASSWORD,  remoteRef: { key: finova, property: db_password } }
#       - { secretKey: MONGODB_PASSWORD, remoteRef: { key: finova, property: mongo_password } }
#
# JWT_SECRET must be >= 32 bytes. The same value is shared by the
# user-service (mints tokens), the api-gateway and every downstream service
# (verify them) — it is the platform's single trust anchor.
# ======================================================================
apiVersion: v1
kind: Secret
metadata:
  name: finova-secrets
  namespace: finova
  labels:
    app.kubernetes.io/part-of: finova
type: Opaque
stringData:
  JWT_SECRET: "REPLACE-ME-with-at-least-32-random-bytes-before-applying"
  DB_PASSWORD: "REPLACE-ME"
  MONGODB_ROOT_PASSWORD: "REPLACE-ME"
  MONGODB_URI: "mongodb://finova:REPLACE-ME@mongodb:27017/finova_fraud?authSource=admin"
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: finova
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: finova
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: discovery-server
  ports:
    - name: http
      port: 8761
      targetPort: http
      protocol: TCP

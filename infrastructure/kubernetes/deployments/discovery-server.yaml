# ======================================================================
# FINOVA — discovery-server
#
# Replicas + resource requests/limits + probes + a rolling update with a
# PDB-friendly maxUnavailable. The readiness probe gates traffic, the
# liveness probe only restarts a genuinely wedged JVM.
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: finova
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: finova
    app.kubernetes.io/component: microservice
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/part-of: finova
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8761"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: discovery-server
      containers:
        - name: discovery-server
          image: finova/.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
          env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef: { name: finova-common-config, key: SPRING_PROFILES_ACTIVE }
        - name: EUREKA_URL
          valueFrom:
            configMapKeyRef: { name: finova-common-config, key: EUREKA_URL }
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef: { name: finova-common-config, key: KAFKA_BOOTSTRAP_SERVERS }
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: { name: finova-secrets, key: JWT_SECRET }
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef: { name: finova-common-config, key: JWT_ISSUER }
        - name: SERVER_PORT
          value: "8761"
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                # Let Eureka deregistration and in-flight requests finish
                # before the JVM is signalled, so a rolling deploy does not
                # produce 503s for requests already in flight.
                command: ["sh", "-c", "sleep 15"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discovery-server-pdb
  namespace: finova
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server

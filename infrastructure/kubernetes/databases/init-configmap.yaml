# ======================================================================
# FINOVA — PostgreSQL database provisioning
#
# Mounted into the postgres StatefulSet's initdb directory, so the
# bounded-context databases are created on first initialisation of the
# volume. Each service owns exactly one database and never reads another's.
# ======================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: finova-postgres-init
  namespace: finova
  labels:
    app.kubernetes.io/part-of: finova
binaryData: {}
data:
  10-create-databases.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    create_database() {
      local database="$1"
      echo "[finova-init] creating database '${database}'"
      psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" <<-EOSQL
        SELECT 'CREATE DATABASE "${database}"'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${database}')\gexec
        GRANT ALL PRIVILEGES ON DATABASE "${database}" TO "${POSTGRES_USER}";
    EOSQL
    }

    for database in ${POSTGRES_MULTIPLE_DATABASES//,/ }; do
      create_database "${database}"
    done

    echo "[finova-init] database provisioning complete."
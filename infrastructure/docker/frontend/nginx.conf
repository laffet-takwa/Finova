server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Long-lived immutable assets from the Vite build.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    index.html must never be cached, otherwise a deploy leaves clients
    booting an old bundle that references assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Single-page app: every unmatched route is handled by Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser only ever talks to this origin; the gateway owns auth,
    # CORS, rate limiting and correlation ids.
    location /api/ {
        proxy_pass         http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    location /actuator/ {
        proxy_pass       http://api-gateway:8080;
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass       http://api-gateway:8080;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass       http://api-gateway:8080;
        proxy_set_header Host $host;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}